<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <rect width="500" height="600" fill="#0d0d0d"/>
  
  <defs>
    <radialGradient id="s02-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="500" height="600" fill="url(#s02-glow)"/>

  <!-- Technical Line Art Series 02: Oversized Drop-Shoulder Tunic -->
  <g transform="translate(0, 30)">
    <!-- Main Body & Long Relaxed Sleeves -->
    <path
      d="M 190 115
         C 215 140, 285 140, 310 115
         L 415 160
         L 395 320
         L 335 285
         L 335 520
         L 165 520
         L 165 285
         L 105 320
         L 85 160
         Z"
      fill="#121212"
      stroke="#e4e4e7"
      stroke-width="1.75"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Architectural Deep Ribbed Collar -->
    <path
      d="M 190 115
         C 215 148, 285 148, 310 115
         C 285 132, 215 132, 190 115
         Z"
      fill="#181818"
      stroke="#c5a059"
      stroke-width="1.5"
    />

    <!-- Dropped Shoulder Construction -->
    <line x1="190" y1="115" x2="370" y2="200" stroke="#71717a" stroke-width="1.25" stroke-dasharray="4,3"/>
    <line x1="310" y1="115" x2="130" y2="200" stroke="#71717a" stroke-width="1.25" stroke-dasharray="4,3"/>

    <!-- Sleeve Hems -->
    <line x1="395" y1="320" x2="335" y2="285" stroke="#a1a1aa" stroke-width="1.5"/>
    <line x1="105" y1="320" x2="85" y2="160" stroke="#a1a1aa" stroke-width="1.5"/>

    <!-- Bottom Hem Continuous Seam -->
    <line x1="165" y1="500" x2="335" y2="500" stroke="#71717a" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="165" y1="520" x2="335" y2="520" stroke="#e4e4e7" stroke-width="1.75"/>

    <!-- Subtle Center Axis -->
    <line x1="250" y1="145" x2="250" y2="520" stroke="#3f3f46" stroke-width="0.75" stroke-dasharray="6,6"/>
  </g>
</svg>


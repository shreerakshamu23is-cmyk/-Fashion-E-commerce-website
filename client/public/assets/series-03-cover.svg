<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <rect width="500" height="600" fill="#0d0d0d"/>
  
  <defs>
    <radialGradient id="s03-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1c1917" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0c0a09" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="500" height="600" fill="url(#s03-glow)"/>

  <!-- Technical Line Art Series 03: Structured Heavyweight Boxy Tee -->
  <g transform="translate(0, 30)">
    <!-- Boxy Architecture Silhouette -->
    <path
      d="M 192 118
         C 215 142, 285 142, 308 118
         L 410 152
         L 375 280
         L 325 255
         L 325 515
         L 175 515
         L 175 255
         L 125 280
         L 90 152
         Z"
      fill="#121212"
      stroke="#e4e4e7"
      stroke-width="1.75"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Reinforced High Crewneck -->
    <path
      d="M 192 118
         C 215 146, 285 146, 308 118
         C 285 134, 215 134, 192 118
         Z"
      fill="#181818"
      stroke="#c5a059"
      stroke-width="1.5"
    />

    <!-- Geometric Shoulder Yoke Lines -->
    <line x1="192" y1="118" x2="355" y2="185" stroke="#71717a" stroke-width="1.25"/>
    <line x1="308" y1="118" x2="145" y2="185" stroke="#71717a" stroke-width="1.25"/>

    <!-- Dual Sleeve Lines -->
    <line x1="375" y1="280" x2="325" y2="255" stroke="#a1a1aa" stroke-width="1.5"/>
    <line x1="125" y1="280" x2="90" y2="152" stroke="#a1a1aa" stroke-width="1.5"/>

    <!-- Bottom Hem Box Cut -->
    <line x1="175" y1="495" x2="325" y2="495" stroke="#71717a" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="175" y1="515" x2="325" y2="515" stroke="#e4e4e7" stroke-width="1.75"/>

    <!-- Center Spine Construction Seam -->
    <line x1="250" y1="145" x2="250" y2="515" stroke="#c5a059" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="4,4"/>
  </g>
</svg>

